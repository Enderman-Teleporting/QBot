plugins {
    id 'java'
    id 'com.gradleup.shadow' version '8.3.8'
    id 'org.jetbrains.kotlin.jvm' version '1.8.10'
}

group 'io.github.et'
version '5.2.1'

repositories {
    mavenCentral()
}

tasks.withType(JavaCompile){
    options.encoding='UTF-8'
    options.annotationProcessorPath = configurations.annotationProcessor
}

shadowJar{
    manifest.attributes.put("Main-Class",'io.github.et.Main')
}

dependencies {
    implementation 'com.alibaba:fastjson:2.0.57'
    implementation 'io.github.enderman-tping:ETToolset:1.0.0-pre3'
    implementation 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.10'
    implementation "top.mrxiaom.mirai:overflow-core:1.0.6"
    implementation 'net.mamoe:mirai-core:2.16.0'
    implementation 'org.fusesource.jansi:jansi:2.4.2'
    implementation 'org.luaj:luaj-jse:3.0.1'
    compileOnly 'org.projectlombok:lombok:1.18.38'
    annotationProcessor 'org.projectlombok:lombok:1.18.38'
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.13.4'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.13.4'
}

sourceSets {
    main.kotlin.srcDirs += 'src/main/kotlin'
    main.java.srcDirs += 'src/main/java'
}

test {
    useJUnitPlatform()
}
